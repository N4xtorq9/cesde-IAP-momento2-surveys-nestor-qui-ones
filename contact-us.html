<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <title>Contacto</title>
</head>

<body>

    <header>



        <nav class="menu-container">
            <h1>LENGUAJES DE PROGRAMACIÓN</h1>
            <ul class="menu-lista">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="survey.html">Survey</a></li>
                <li><a href="contact-us.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <form>
            <fieldset class="contact">
                <legend class="contacto-legend">Contacto </legend>
                <p>
                    Escriba su nombre: <input type="text" id="nombre" name="nombre" placeholder="Nombre"
                        pattern="[a-z]{1,15}" required>
                </p>
                <p>
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="Correo electrónico" pattern="[a-z]{1,15}"
                        required>
                </p>
                <p>
                    <label for="">Género: </label>
                    <input type="radio" name="genero" id="" required />Masculino
                    <input type="radio" name="genero" id="" required />Femenino
                    <input type="radio" name="genero" id="" required />Otro
                </p>

                <p>
                    <label for="check">Acepta terminos y condiciones</label>

                    <input type="radio" name="frecuencia" id="" required>Sí
                    <input type="radio" name="frecuencia" id="" required>No
                </p>
                <p>

                    Dejame tu comentario: <br>

                    <textarea name="comentario" id="comentario" rows="9" cols="20"></textarea>
                </p>
                <button type="submit" class="boton-enviar">Enviar</button>
            </fieldset>
        </form>
    </main>
</body>

<footer class="footer">
    <p> Nestor Javier Quiñones Valencia | Proyecto académico sin frameworks – 2026 Momento 2 </p>
</footer>

</html>
