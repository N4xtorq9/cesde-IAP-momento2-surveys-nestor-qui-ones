<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <title>Contacto</title>
</head>
<body>

    <header>



        <nav class="menu-container">
            <h1>LENGUAJES DE PROGRAMACIÓN</h1>
            <ul class="menu-lista">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="survey.html">Survey</a></li>
                <li><a href="contact-us.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 align="center"> Contacto </h2>
        <form action="/registro" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>Informaciòn Personal</legend>
                Escriba su nombre: <input type="text" id="nombre" name="nombre" placeholder="Nombre"
                    pattern="[a-z]{1,15}" required>
                <br>
                <br>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="Correo electrónico" pattern="[a-z]{1,15}"
                    required>
                <br>
                <br>
                Dejame tu comentario: <br>

                <textarea name="comentario" id="comentario" rows="9" cols="20"></textarea>
                <button type="submit">Enviar</button>
            </fieldset>
        </form>
    </main>
</body>
</html>
